name: Deploy Cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nasab.saddadnabbil.my.id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and apply database migrations
        run: npm run build
        env:
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_URL: "https://nasab.saddadnabbil.my.id"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GROK_AUTH_ISSUER: "https://auth.grok.me"
          GROK_AUTH_CLIENT_ID: ${{ secrets.GROK_AUTH_CLIENT_ID }}
          GROK_AUTH_CLIENT_SECRET: ${{ secrets.GROK_AUTH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            BETTER_AUTH_SECRET
            DATABASE_URL
            GROK_AUTH_CLIENT_ID
            GROK_AUTH_CLIENT_SECRET
            RESEND_API_KEY
          vars: |
            VITE_AUTH_ENABLED
            BETTER_AUTH_URL
            GROK_AUTH_ISSUER
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROK_AUTH_CLIENT_ID: ${{ secrets.GROK_AUTH_CLIENT_ID }}
          GROK_AUTH_CLIENT_SECRET: ${{ secrets.GROK_AUTH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_URL: "https://nasab.saddadnabbil.my.id"
          GROK_AUTH_ISSUER: "https://auth.grok.me"
